name: tests

on:
  push:
    branches:
      - main
      - feat/ai-plugin-architecture
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workspace
        run: uv sync --all-packages
      - name: Run tests
        run: uv run pytest
